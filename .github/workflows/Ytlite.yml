name: Build YTLitePlusEXTRA With Custom .DEB File

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to the decrypted IPA file"
        default: ""
        required: true
        type: string

      ytlite_deb_url:
        description: "URL to the YTLite .deb file"
        default: ""
        required: true
        type: string
        
      ytlite_version:
        description: "YTLite Version (Optional - leave blank to detect automatically from DEB)"
        default: ""
        required: false
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "YouTube"
        required: true
        type: string

      bundle_id:
        description: "Bundle ID (Optional)"
        default: "com.google.ios.youtube"
        required: true
        type: string

      youpip:
        description: "Integrate YouPiP"
        default: true
        required: false
        type: boolean

      ytuhd:
        description: "Integrate YTUHD"
        default: true
        required: false
        type: boolean

      ryd:
        description: "Integrate Return-YouTube-Dislikes"
        default: true
        required: false
        type: boolean

      abconfig:
        description: "Integrate YTABConfig"
        default: true
        required: false
        type: boolean

      youquality:
        description: "Integrate YouQuality"
        default: true
        required: false
        type: boolean

      ytnovote:
        description: "Integrate YTSilentVote"
        default: true
        required: false
        type: boolean

      youshare:
        description: "Integrate YouShare"
        default: true
        required: false
        type: boolean

      gonerino:
        description: "Integrate Gonerino"
        default: true
        required: false
        type: boolean

      ytweaks:
        description: "Integrate YTweaks"
        default: true
        required: false
        type: boolean

      yougetcaption:
        description: "Integrate YouGetCaption"
        default: true
        required: false
        type: boolean

      demc:
        description: "Integrate DontEatMyContent"
        default: true
        required: false
        type: boolean

      volboost:
        description: "Integrate VolumeBoostYT (Require iOS 16+)"
        default: true
        required: false
        type: boolean

      uncappedavplayer:
        description: "Integrate UncappedAVPlayer"
        default: false
        required: false
        type: boolean

      youslider:
        description: "Integrate YouSlider"
        default: false
        required: false
        type: boolean

      native_share:
        description: "Integrate youtube-native-share"
        default: false
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build YTLitePlusEXTRA IPA
    runs-on: xcode-27
    permissions:
      contents: write

    steps:
      - name: Hide Sensitive Inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: bundle_id,display_name,ytlite_version,youpip,ytuhd,ryd,abconfig,youquality,ytnovote,youshare,gonerino,ytweaks,yougetcaption,demc,volboost,uncappedavplayer,youslider,native_share

      - name: Install MEGA downloader
        if: ${{ startsWith(inputs.ipa_url, 'https://mega.nz/') || startsWith(inputs.ytlite_deb_url, 'https://mega.nz/') }}
        run: brew install megatools

      - name: Download IPA from Mega share link
        if: ${{ startsWith(inputs.ipa_url, 'https://mega.nz/') }}
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          megadl --no-progress --path youtube.ipa "$IPA_URL"

      - name: Download IPA from direct URL
        if: ${{ !startsWith(inputs.ipa_url, 'https://mega.nz/') }}
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          wget "$IPA_URL" --quiet --no-verbose -O youtube.ipa

      - name: Validate IPA
        run: |
          file_type=$(file --mime-type -b youtube.ipa)

          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The downloaded file is not a valid IPA. Detected type: $file_type."
            exit 1
          fi

      - name: Get YouTube Version
        run: |
          unzip -q youtube.ipa -d ytextracted

          YT_VERSION=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "ytextracted/Payload/YouTube.app/Info.plist")

          echo "YT_VERSION=$YT_VERSION" >> "$GITHUB_ENV"
          echo "Detected YouTube version: $YT_VERSION"

      - name: Remove and Validate UIDesignRequiresCompatibility
        run: |
          PLIST="ytextracted/Payload/YouTube.app/Info.plist"

          echo "Checking for UIDesignRequiresCompatibility..."

          if /usr/libexec/PlistBuddy -c "Print :UIDesignRequiresCompatibility" "$PLIST" >/dev/null 2>&1; then
            echo "UIDesignRequiresCompatibility found. Removing it..."
            /usr/libexec/PlistBuddy -c "Delete :UIDesignRequiresCompatibility" "$PLIST"
          else
            echo "UIDesignRequiresCompatibility is already absent."
          fi

          echo "Validating modified Info.plist..."

          if /usr/libexec/PlistBuddy -c "Print :UIDesignRequiresCompatibility" "$PLIST" >/dev/null 2>&1; then
            echo "::error::UIDesignRequiresCompatibility is still present in extracted Info.plist."
            exit 1
          fi

          echo "UIDesignRequiresCompatibility removed from extracted Info.plist."

          echo "Repacking modified YouTube IPA..."

          rm -f youtube.ipa

          (
            cd ytextracted
            zip -qry -y ../youtube.ipa Payload
          )

          echo "Checking rebuilt IPA integrity..."

          if ! unzip -tq youtube.ipa >/dev/null 2>&1; then
            echo "::error::Rebuilt youtube.ipa is invalid or corrupted."
            exit 1
          fi

          echo "Extracting Info.plist from rebuilt IPA for final validation..."

          rm -f /tmp/youtube-final-Info.plist

          unzip -p youtube.ipa \
            "Payload/YouTube.app/Info.plist" \
            > /tmp/youtube-final-Info.plist

          if [ ! -s /tmp/youtube-final-Info.plist ]; then
            echo "::error::Could not extract Info.plist from rebuilt IPA."
            exit 1
          fi

          echo "Validating UIDesignRequiresCompatibility inside rebuilt IPA..."

          if /usr/libexec/PlistBuddy -c "Print :UIDesignRequiresCompatibility" \
            /tmp/youtube-final-Info.plist >/dev/null 2>&1; then
            echo "::error::UIDesignRequiresCompatibility is still present inside rebuilt youtube.ipa."
            exit 1
          fi

          echo "✅ UIDesignRequiresCompatibility is absent from rebuilt youtube.ipa."
          echo "✅ Modified IPA successfully repacked and validated."
      
      - name: Install Dependencies
        run: brew install make ldid meson ninja dpkg

      - name: Install Go
        if: ${{ inputs.gonerino }}
        run: brew install go

      - name: Set PATH Environment Variables
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      # Original from YTweaks
      - name: Get tweaks commit
        run: |
          get_commit_hash() {
            local repo_url=$1
            git ls-remote "$repo_url" HEAD | awk '{print substr($1,1,7)}'
          }
          echo "THEOS_COMMIT=$(get_commit_hash "https://github.com/theos/theos")" >> $GITHUB_ENV

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v6
        with:
          path: theos
          key: 27.0-SDK-${{ env.THEOS_COMMIT }}

      - name: Setup Theos
        if: ${{ steps.cache-theos.outputs.cache-hit != 'true' }}
        run: |
          git clone --quiet --depth=1 --recurse-submodules https://github.com/theos/theos.git

          cd "$THEOS/vendor/logos"
          git checkout a62370066a97e36d59b200a9fa10c5091f5e8972

      - name: Setup Latest Stable iOS SDK
        run: |
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"

          echo "Xcode version:"
          xcodebuild -version

          echo "Detected iOS SDK: $SDK_VERSION"
          echo "SDK path: $SDK_PATH"

          if [ "$SDK_VERSION" != "27.0" ]; then
            echo "::error::Expected iOS 27.0 SDK but found $SDK_VERSION."
            exit 1
          fi

          rm -rf "$THEOS/sdks"
          mkdir -p "$THEOS/sdks"

          ln -s "$SDK_PATH" "$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"

          echo "Theos SDKs:"
          ls -la "$THEOS/sdks"

          if [ ! -d "$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk" ]; then
            echo "::error::Failed to configure iOS $SDK_VERSION SDK for Theos."
            exit 1
          fi

          echo "✅ Theos configured with iOS $SDK_VERSION SDK."
            
      - name: Clone headers
        run: |
          if [ ! -d "$THEOS/include/YouTubeHeader" ]; then
            git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git "$THEOS/include/YouTubeHeader"
          else
            cd $THEOS/include/YouTubeHeader
            git pull --quiet --force
            cd ${{ github.workspace }}
          fi
          
          if [ "${{ inputs.demc }}" = "true" ]; then
            rm -fr "$THEOS/include/YTHeaders"
            cp -r "$THEOS/include/YouTubeHeader" "$THEOS/include/YTHeaders"
          fi
          
          if [ ! -d "$THEOS/include/PSHeader" ]; then
            git clone --quiet --depth=1 https://github.com/PoomSmart/PSHeader.git "$THEOS/include/PSHeader"
          else
            cd $THEOS/include/PSHeader
            git pull --quiet --force
            cd ${{ github.workspace }}
          fi

      - name: Fix Theos od broken pipe issue
        run: sed -i '' 's/od -c "$i" | head/od -c "$i" 2>\/dev\/null | head/g' $THEOS/bin/convert_xml_plist.sh || true

      - name: Install cyan
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      # ==========================================================
      # CUSTOM YTLITE DEB DOWNLOAD
      # ==========================================================

      - name: Download YTLite DEB from Mega share link
        if: ${{ startsWith(inputs.ytlite_deb_url, 'https://mega.nz/') }}
        env:
          YTLITE_DEB_URL: ${{ inputs.ytlite_deb_url }}
        run: |
          megadl --no-progress --path ytlite.deb "$YTLITE_DEB_URL"

      - name: Download YTLite DEB from direct URL
        if: ${{ !startsWith(inputs.ytlite_deb_url, 'https://mega.nz/') }}
        env:
          YTLITE_DEB_URL: ${{ inputs.ytlite_deb_url }}
        run: |
          wget "$YTLITE_DEB_URL" --quiet --no-verbose -O ytlite.deb

      - name: Get YTLite Version
        run: |
          if [ -n "${{ inputs.ytlite_version }}" ]; then
            YTLITE_VERSION="${{ inputs.ytlite_version }}"
          else
            YTLITE_VERSION=$(dpkg-deb -f ytlite.deb Version)

            # Remove common Debian revision suffix if present
            YTLITE_VERSION="${YTLITE_VERSION%%-*}"
          fi

          echo "YTLITE_VERSION=$YTLITE_VERSION" >> "$GITHUB_ENV"
          echo "Detected YTLite version: $YTLITE_VERSION"

      # ==========================================================

      - name: Clone Open in YouTube (Safari Extension)
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/BillyCurtis/OpenYouTubeSafariExtension.git
          cd OpenYouTubeSafariExtension
          git sparse-checkout set --no-cone OpenYouTubeSafariExtension.appex
          git checkout
          mv *.appex ${{ github.workspace }}

      - name: Clone YouPiP
        if: ${{ inputs.youpip }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YouPiP.git
    
      - name: Clone YTUHD
        if: ${{ inputs.ytuhd }}
        run: git clone --quiet --depth=1 --recurse https://github.com/PoomSmart/YTUHD.git
           
      - name: Clone Return-YouTube-Dislikes
        if: ${{ inputs.ryd }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/Return-YouTube-Dislikes.git

      - name: Clone YouGroupSettings
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YouGroupSettings.git
           
      - name: Clone YTVideoOverlay
        if: ${{ inputs.youpip || inputs.ytuhd || inputs.youquality }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YTVideoOverlay.git
          
      - name: Clone YTABConfig
        if: ${{ inputs.abconfig }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YTABConfig.git
                  
      - name: Clone YouQuality
        if: ${{ inputs.youquality }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YouQuality.git

      - name: Clone DontEatMyContent
        if: ${{ inputs.demc }}
        run: git clone --quiet --depth=1 https://github.com/therealFoxster/DontEatMyContent.git

      - name: Clone YTSilentVote
        if: ${{ inputs.ytnovote }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YTSilentVote.git

      - name: Clone YouShare
        if: ${{ inputs.youshare }}
        run: git clone --quiet --depth=1 https://github.com/Tonwalter888/YouShare.git

      - name: Clone Gonerino
        if: ${{ inputs.gonerino }}
        run: git clone --quiet --depth=1 https://github.com/castdrian/Gonerino.git

      - name: Clone YTweaks
        if: ${{ inputs.ytweaks }}
        run: git clone --quiet --depth=1 https://github.com/fosterbarnes/YTweaks.git

      - name: Clone YouGetCaption
        if: ${{ inputs.yougetcaption }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YouGetCaption.git

      - name: Clone UncappedAVPlayer
        if: ${{ inputs.uncappedavplayer }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/UncappedAVPlayer.git

      - name: Clone YouSlider
        if: ${{ inputs.youslider }}
        run: |
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouSlider.git
          wget --no-verbose --quiet https://github.com/Tonwalter888/Tonwalter888.github.io/raw/refs/heads/main/debs/alderis.deb

      - name: Clone youtube-native-share
        if: ${{ inputs.native_share }}
        run: git clone --quiet --depth=1 https://github.com/jkhsjdhjs/youtube-native-share.git

      - name: Clone VolumeBoostYT
        if: ${{ inputs.volboost }}
        run: git clone --quiet --depth=1 https://github.com/VasirakCalgux/VolumeBoostYT.git
        
      - name: Build YouPiP
        if: ${{ inputs.youpip }}
        run: |
          cd YouPiP
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/youpip.deb    

      - name: Build YTUHD
        if: ${{ inputs.ytuhd }}
        run: |
          cd YTUHD
          make libvpx dav1d
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless SIDELOAD=1
          mv packages/*.deb ${{ github.workspace }}/ytuhd.deb

      - name: Build Return-YouTube-Dislikes
        if: ${{ inputs.ryd }}
        run: |
          cd Return-YouTube-Dislikes
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/ryd.deb

      - name: Build YouGroupSettings
        run: |
          cd YouGroupSettings
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/ygs.deb

      - name: Build YTVideoOverlay
        if: ${{ inputs.youpip || inputs.ytuhd || inputs.youquality }}
        run: |
          cd YTVideoOverlay
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/ytvo.deb

      - name: Build YTABConfig
        if: ${{ inputs.abconfig }}
        run: |
          cd YTABConfig
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/ytabconfig.deb

      - name: Build YouQuality
        if: ${{ inputs.youquality }}
        run: |
          cd YouQuality
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/youquality.deb

      - name: Build DontEatMyContent
        if: ${{ inputs.demc }}
        run: |
          cd DontEatMyContent
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/demc.deb

      - name: Build YTSilentVote
        if: ${{ inputs.ytnovote }}
        run: |
          cd YTSilentVote
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/ytnovote.deb  

      - name: Build YouShare
        if: ${{ inputs.youshare }}
        run: |
          cd YouShare
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/youshare.deb
          
      - name: Build Gonerino
        if: ${{ inputs.gonerino }}
        run: |
          cd Gonerino
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/gonerino.deb

      - name: Build YouGetCaption
        if: ${{ inputs.yougetcaption }}
        run: |
          cd YouGetCaption
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/ygc.deb

      - name: Build YTweaks
        if: ${{ inputs.ytweaks }}
        run: |
          cd YTweaks
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/ytweaks.deb

      - name: Build UncappedAVPlayer
        if: ${{ inputs.uncappedavplayer }}
        run: |
          cd UncappedAVPlayer
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64
          mv packages/*.deb ${{ github.workspace }}/uncapavplayer.deb

      - name: Build YouSlider
        if: ${{ inputs.youslider }}
        run: |
          cd YouSlider
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/youslider.deb

      - name: Build youtube-native-share
        if: ${{ inputs.native_share }}
        run: |
          cd youtube-native-share
          git clone --quiet --depth=1 https://github.com/protocolbuffers/protobuf.git
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64
          mv packages/*.deb ${{ github.workspace }}/ytnativeshare.deb

      - name: Build VolumeBoostYT
        if: ${{ inputs.volboost }}
        run: |
          cd VolumeBoostYT
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64
          mv packages/*.deb ${{ github.workspace }}/volboostyt.deb
          
      - name: Inject Tweaks Into IPA
        run: |
          tweaks="OpenYouTubeSafariExtension.appex"

          for f in *.deb; do
            tweaks="$tweaks $f"
          done
          
          cyan -i youtube.ipa -o YTLitePlusEXTRA_${{ env.YT_VERSION }}_v${{ env.YTLITE_VERSION }}.ipa -uwef $tweaks -n "${{ inputs.display_name }}" -b ${{ inputs.bundle_id }}

      - name: Create a Draft Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ytliteplusextra-ipa${{ github.run_number }}
          name: YTLitePlusEXTRA_${{ env.YT_VERSION }}_v${{ env.YTLITE_VERSION }} (${{ github.run_number }})
          files: YTLitePlusEXTRA_${{ env.YT_VERSION }}_v${{ env.YTLITE_VERSION }}.ipa
          draft: true

      - name: Job Summary - Build Complete
        run: |
          echo -e '### 🛠️ Build YTLitePlusEXTRA IPA Complete!' >> $GITHUB_STEP_SUMMARY

      - name: Job Summary - Output the Draft Release Link
        run: |
          echo -e '### 🚀 Draft Release\n\nDraft release has been created successfully! You can view your release here: https://github.com/${{ github.repository }}/releases' >> $GITHUB_STEP_SUMMARY     
          
      - name: Job Summary - Cleanup
        run: |
          echo -e '### 🧹 Cleanup\n\nYou can remove previous GitHub Actions run here: https://github.com/${{ github.repository }}/actions/workflows/delete-old-workflows-run.yml And if you want to delelte old draft releases you have then here: https://github.com/${{ github.repository }}/actions/workflows/delete-old-draft-releases.yml' >> $GITHUB_STEP_SUMMARY
