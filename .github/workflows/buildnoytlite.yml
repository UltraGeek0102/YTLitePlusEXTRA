name: Build IPA WITHOUT YTLITE

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to your clean decrypted YouTube IPA"
        required: true
        default: ""
        type: string

      display_name:
        description: "App Name"
        required: true
        default: "YouTube"
        type: string

      bundle_id:
        description: "Bundle ID"
        required: true
        default: "com.google.ios.youtube"
        type: string

      ytkace:
        description: "Integrate YTKACE"
        default: true
        required: false
        type: boolean

      youpip:
        description: "Integrate YouPiP"
        default: true
        required: false
        type: boolean

      ytuhd:
        description: "Integrate YTUHD"
        default: true
        required: false
        type: boolean

      ryd:
        description: "Integrate Return-YouTube-Dislikes"
        default: true
        required: false
        type: boolean

      abconfig:
        description: "Integrate YTABConfig"
        default: true
        required: false
        type: boolean

      youquality:
        description: "Integrate YouQuality"
        default: false
        required: false
        type: boolean

      demc:
        description: "Integrate DontEatMyContent"
        default: true
        required: false
        type: boolean

      ytweaks:
        description: "Integrate YTweaks"
        default: true
        required: false
        type: boolean

      youslider:
        description: "Integrate YouSlider"
        default: true
        required: false
        type: boolean

      ytshare:
        description: "Integrate youtube-native-share"
        default: true
        required: false
        type: boolean

      volboost:
        description: "Integrate VolumeBoostYT (Requires iOS 16+)"
        default: true
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ytkace:
    name: Build YTKACE
    uses: ./.github/workflows/build-deb.yml

  package:
    name: Build Custom IPA
    needs: build-ytkace
    runs-on: macos-latest

    steps:
      - name: Checkout YTKACE
        uses: actions/checkout@v6

      - name: Download Built YTKACE
        uses: actions/download-artifact@v8
        with:
          name: YTKACE-deb-rootless
          path: ytkace-packages

      - name: Hide Sensitive Inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: bundle_id,display_name,ytkace,youpip,ytuhd,ryd,abconfig,youquality,demc,ytweaks,youslider,ytshare,volboost

      - name: Install MEGA Downloader
        if: ${{ startsWith(inputs.ipa_url, 'https://mega.nz/') }}
        run: brew install megatools

      - name: Install Dependencies
        run: |
          set -euo pipefail

          brew install make ldid dpkg swiftlint
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

          wget --quiet --no-verbose \
            "https://github.com/inoahdev/tbd/releases/download/2.2/tbd-mac" \
            -O /usr/local/bin/tbd
          chmod +x /usr/local/bin/tbd

      - name: Set PATH Environment Variables
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "THEOS=${{ github.workspace }}/theos" >> "$GITHUB_ENV"

      - name: Get Theos Commit
        run: |
          set -euo pipefail
          THEOS_COMMIT="$(git ls-remote https://github.com/theos/theos HEAD | awk '{print substr($1,1,7)}')"
          echo "THEOS_COMMIT=$THEOS_COMMIT" >> "$GITHUB_ENV"

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v6
        with:
          path: theos
          key: 26.5-SDK-${{ env.THEOS_COMMIT }}

      - name: Setup Theos
        if: ${{ steps.cache-theos.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail

          git clone --quiet --depth=1 --recurse-submodules \
            https://github.com/theos/theos.git "$THEOS"

          git clone --quiet --depth=1 -n --filter=tree:0 \
            https://github.com/Tonwalter888/iOS-SDKs.git iOS-SDKs

          cd iOS-SDKs
          git sparse-checkout set --no-cone iPhoneOS26.5.sdk
          git checkout --quiet
          mv *.sdk "$THEOS/sdks"

          cd "$THEOS/vendor/logos"
          git checkout a62370066a97e36d59b200a9fa10c5091f5e8972

      - name: Clone Headers
        run: |
          set -euo pipefail

          if [ ! -d "$THEOS/include/YouTubeHeader" ]; then
            git clone --quiet --depth=1 \
              https://github.com/PoomSmart/YouTubeHeader.git \
              "$THEOS/include/YouTubeHeader"
          else
            git -C "$THEOS/include/YouTubeHeader" pull --quiet --force
          fi

          if [ "${{ inputs.demc }}" = "true" ]; then
            rm -rf "$THEOS/include/YTHeaders"
            cp -r "$THEOS/include/YouTubeHeader" "$THEOS/include/YTHeaders"
          fi

          if [ ! -d "$THEOS/include/PSHeader" ]; then
            git clone --quiet --depth=1 \
              https://github.com/PoomSmart/PSHeader.git \
              "$THEOS/include/PSHeader"
          else
            git -C "$THEOS/include/PSHeader" pull --quiet --force
          fi

      - name: Fix Theos Broken Pipe Issue
        run: |
          sed -i '' \
            's/od -c "$i" | head/od -c "$i" 2>\/dev\/null | head/g' \
            "$THEOS/bin/convert_xml_plist.sh" || true

      - name: Download IPA From MEGA
        if: ${{ startsWith(inputs.ipa_url, 'https://mega.nz/') }}
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          megadl --no-progress --path youtube.ipa "$IPA_URL"

      - name: Download IPA From URL
        if: ${{ !startsWith(inputs.ipa_url, 'https://mega.nz/') }}
        env:
          IPA_URL: ${{ inputs.ipa_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$IPA_URL" == "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/"* ]]; then
            curl --fail --location \
              --retry 3 \
              --retry-delay 2 \
              --header "Accept: application/octet-stream" \
              --header "Authorization: Bearer $GH_TOKEN" \
              "$IPA_URL" \
              --output youtube.ipa
          else
            curl --fail --location \
              --retry 3 \
              --retry-delay 2 \
              "$IPA_URL" \
              --output youtube.ipa
          fi

      - name: Validate IPA
        run: |
          set -euo pipefail

          file_type="$(file --mime-type -b youtube.ipa)"
          echo "Detected file type: $file_type"

          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Downloaded file is not a valid IPA."
            exit 1
          fi

          if ! unzip -tq youtube.ipa >/dev/null; then
            echo "::error::Downloaded IPA is not a valid ZIP/IPA archive."
            exit 1
          fi

      - name: Ensure Input IPA Is Clean
        run: |
          set -euo pipefail

          EXISTING="$(
            unzip -Z1 youtube.ipa \
              | grep -Ei '(^|/)(YTLite|YTKACE)(\.dylib|\.bundle)(/|$)' \
              || true
          )"

          if [ -n "$EXISTING" ]; then
            echo "::error::The supplied IPA already contains YTLite or YTKACE:"
            echo "$EXISTING"
            echo "::error::Please provide a clean decrypted YouTube IPA."
            exit 1
          fi

          echo "Clean decrypted YouTube IPA confirmed."

      - name: Detect Versions
        run: |
          set -euo pipefail

          YT_VERSION="$(python3 - <<'PY'
          import plistlib
          import zipfile

          with zipfile.ZipFile("youtube.ipa") as archive:
              info = next(
                  name for name in archive.namelist()
                  if name.startswith("Payload/") and name.endswith(".app/Info.plist")
              )
              plist = plistlib.loads(archive.read(info))
              print(plist.get("CFBundleShortVersionString",
                              plist.get("CFBundleVersion", "Unknown")))
          PY
          )"

          YTKACE_VERSION="$(awk '/^Version:/ {print $2}' control)"

          echo "YT_VERSION=$YT_VERSION" >> "$GITHUB_ENV"
          echo "YTKACE_VERSION=$YTKACE_VERSION" >> "$GITHUB_ENV"

          echo "YouTube version: $YT_VERSION"
          echo "YTKACE version: $YTKACE_VERSION"

      - name: Clone Open in YouTube Safari Extension
        run: |
          set -euo pipefail
          git clone --quiet -n --depth=1 --filter=tree:0 \
            https://github.com/BillyCurtis/OpenYouTubeSafariExtension.git \
            OpenYouTubeSafariExtension
          cd OpenYouTubeSafariExtension
          git sparse-checkout set --no-cone OpenYouTubeSafariExtension.appex
          git checkout --quiet
          mv *.appex "${{ github.workspace }}"

      - name: Clone YouPiP
        if: ${{ inputs.youpip }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YouPiP.git

      - name: Clone YTUHD
        if: ${{ inputs.ytuhd }}
        run: git clone --quiet --depth=1 --recurse-submodules https://github.com/PoomSmart/YTUHD.git

      - name: Clone Return-YouTube-Dislikes
        if: ${{ inputs.ryd }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/Return-YouTube-Dislikes.git

      - name: Clone YouGroupSettings
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YouGroupSettings.git

      - name: Clone YTVideoOverlay
        if: ${{ inputs.youpip || inputs.ytuhd || inputs.youquality }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YTVideoOverlay.git

      - name: Clone YTABConfig
        if: ${{ inputs.abconfig }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YTABConfig.git

      - name: Clone UncappedAVPlayer
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/UncappedAVPlayer.git

      - name: Clone DontEatMyContent
        if: ${{ inputs.demc }}
        run: git clone --quiet --depth=1 https://github.com/therealFoxster/DontEatMyContent.git

      - name: Clone YouSlider
        if: ${{ inputs.youslider }}
        run: |
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouSlider.git
          wget --no-verbose --quiet \
            https://github.com/Tonwalter888/Tonwalter888.github.io/raw/refs/heads/main/deb/alderis.deb \
            -O alderis.deb

      - name: Clone YTweaks
        if: ${{ inputs.ytweaks }}
        run: git clone --quiet --depth=1 https://github.com/fosterbarnes/YTweaks.git

      - name: Clone youtube-native-share
        if: ${{ inputs.ytshare }}
        run: git clone --quiet --depth=1 https://github.com/jkhsjdhjs/youtube-native-share.git

      - name: Clone VolumeBoostYT
        if: ${{ inputs.volboost }}
        run: git clone --quiet --depth=1 https://github.com/VasirakCalgux/VolumeBoostYT.git

      - name: Clone YouQuality
        if: ${{ inputs.youquality }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YouQuality.git

      - name: Build YouPiP
        if: ${{ inputs.youpip }}
        run: |
          set -euo pipefail
          cd YouPiP
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb "${{ github.workspace }}/youpip.deb"

      - name: Build YTUHD
        if: ${{ inputs.ytuhd }}
        run: |
          set -euo pipefail
          cd YTUHD
          brew install meson ninja
          make libvpx dav1d
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless SIDELOAD=1
          mv packages/*.deb "${{ github.workspace }}/ytuhd.deb"

      - name: Build Return-YouTube-Dislikes
        if: ${{ inputs.ryd }}
        run: |
          set -euo pipefail
          cd Return-YouTube-Dislikes
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb "${{ github.workspace }}/ryd.deb"

      - name: Build YouGroupSettings
        run: |
          set -euo pipefail
          cd YouGroupSettings
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb "${{ github.workspace }}/ygs.deb"

      - name: Build YTVideoOverlay
        if: ${{ inputs.youpip || inputs.ytuhd || inputs.youquality }}
        run: |
          set -euo pipefail
          cd YTVideoOverlay
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb "${{ github.workspace }}/ytvo.deb"

      - name: Build YTABConfig
        if: ${{ inputs.abconfig }}
        run: |
          set -euo pipefail
          cd YTABConfig
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb "${{ github.workspace }}/ytabconfig.deb"

      - name: Build UncappedAVPlayer
        run: |
          set -euo pipefail
          cd UncappedAVPlayer
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64
          mv packages/*.deb "${{ github.workspace }}/uncapavplayer.deb"

      - name: Build DontEatMyContent
        if: ${{ inputs.demc }}
        run: |
          set -euo pipefail
          cd DontEatMyContent
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb "${{ github.workspace }}/demc.deb"

      - name: Build YouSlider
        if: ${{ inputs.youslider }}
        run: |
          set -euo pipefail
          cd YouSlider
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb "${{ github.workspace }}/youslider.deb"

      - name: Build YTweaks
        if: ${{ inputs.ytweaks }}
        run: |
          set -euo pipefail
          cd YTweaks
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb "${{ github.workspace }}/ytweaks.deb"

      - name: Build youtube-native-share
        if: ${{ inputs.ytshare }}
        run: |
          set -euo pipefail
          cd youtube-native-share
          git clone --quiet --depth=1 https://github.com/protocolbuffers/protobuf.git
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64
          mv packages/*.deb "${{ github.workspace }}/ytnativeshare.deb"

      - name: Build VolumeBoostYT
        if: ${{ inputs.volboost }}
        run: |
          set -euo pipefail
          cd VolumeBoostYT
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64
          mv packages/*.deb "${{ github.workspace }}/volboostyt.deb"

      - name: Build YouQuality
        if: ${{ inputs.youquality }}
        run: |
          set -euo pipefail
          cd YouQuality
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb "${{ github.workspace }}/youquality.deb"

      - name: Extract YTKACE
        if: ${{ inputs.ytkace }}
        run: |
          set -euo pipefail

          rm -rf ytkace-root
          mkdir -p ytkace-root

          YTKACE_DEB="$(find ytkace-packages -type f -name "*.deb" -print -quit)"

          if [ -z "$YTKACE_DEB" ]; then
            echo "::error::YTKACE rootless .deb was not found."
            exit 1
          fi

          dpkg-deb -x "$YTKACE_DEB" ytkace-root

          YTKACE_DYLIB="ytkace-root/var/jb/Library/MobileSubstrate/DynamicLibraries/YTKACE.dylib"

          if [ ! -f "$YTKACE_DYLIB" ]; then
            echo "::error::YTKACE.dylib was not found after extraction."
            exit 1
          fi

          echo "YTKACE dylib:"
          ls -lh "$YTKACE_DYLIB"

      - name: Integrate YTKACE
        if: ${{ inputs.ytkace }}
        run: |
          set -euo pipefail

          export LDID="$(brew --prefix)/bin/ldid"

          output="YouTube_Base.ipa"

          echo "Integrating YTKACE into clean YouTube IPA..."

          bash Scripts/sideload-repack.sh \
            youtube.ipa \
            ytkace-root/var/jb/Library/MobileSubstrate/DynamicLibraries/YTKACE.dylib \
            "$output"

          if [ ! -s "$output" ]; then
            echo "::error::YTKACE base IPA was not created."
            exit 1
          fi

          if ! unzip -tq "$output" >/dev/null; then
            echo "::error::Generated YTKACE IPA is not a valid IPA archive."
            exit 1
          fi

          echo "YTKACE base IPA created successfully:"
          ls -lh "$output"

      - name: Verify YTKACE
        if: ${{ inputs.ytkace }}
        run: |
          set -euo pipefail

          rm -rf verify-ytkace
          mkdir -p verify-ytkace

          unzip -q YouTube_Base.ipa -d verify-ytkace

          APP="$(find verify-ytkace/Payload -maxdepth 1 -type d -name "*.app" -print -quit)"

          if [ -z "$APP" ]; then
            echo "::error::YouTube.app was not found."
            exit 1
          fi

          YTKACE_DYLIB="$(find "$APP" -type f -name "YTKACE.dylib" -print -quit)"

          if [ -z "$YTKACE_DYLIB" ]; then
            echo "::error::YTKACE.dylib is missing from the IPA."
            exit 1
          fi

          EXECUTABLE="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleExecutable" \
              "$APP/Info.plist"
          )"

          if ! otool -L "$APP/$EXECUTABLE" | grep -q "YTKACE.dylib"; then
            echo "::error::YouTube executable does not load YTKACE.dylib."
            exit 1
          fi

          echo "YTKACE injection verified."

      - name: Use Clean IPA Without YTKACE
        if: ${{ !inputs.ytkace }}
        run: cp youtube.ipa YouTube_Base.ipa

      - name: Inject Extra Tweaks
        id: inject
        run: |
          set -euo pipefail

          tweaks="OpenYouTubeSafariExtension.appex"

          echo "Injecting additional tweaks:"

          for f in *.deb; do
            [ -e "$f" ] || continue
            echo "  $f"
            tweaks="$tweaks $f"
          done

          if [ "${{ inputs.ytkace }}" = "true" ]; then
            output="YTKACE_${YTKACE_VERSION}_YouTube_${YT_VERSION}_Custom.ipa"
          else
            output="YouTube_${YT_VERSION}_Custom.ipa"
          fi

          cyan \
            -i YouTube_Base.ipa \
            -o "$output" \
            -uwef $tweaks \
            -n "${{ inputs.display_name }}" \
            -b "${{ inputs.bundle_id }}"

          if [ ! -s "$output" ]; then
            echo "::error::Final IPA was not produced."
            exit 1
          fi

          if ! unzip -tq "$output" >/dev/null; then
            echo "::error::Final IPA archive is invalid."
            exit 1
          fi

          echo "Final IPA created successfully:"
          ls -lh "$output"

          echo "ipa=$output" >> "$GITHUB_OUTPUT"

      - name: Upload Custom IPA
        uses: actions/upload-artifact@v7
        with:
          name: YouTube-Custom-IPA
          path: ${{ steps.inject.outputs.ipa }}
          if-no-files-found: error
